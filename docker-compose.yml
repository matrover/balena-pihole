version: "2.1"

volumes:
  pihole_config: {}
  tailscale: {}

services:
  pihole:
    build: pihole
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    volumes:
      - "pihole_config:/etc/pihole"
    environment:
      FTLCONF_webserver_port: "8080o,[::]:8080o"
    dns:
      - "127.0.0.1"
      - "1.1.1.1"
    network_mode: host
    tmpfs:
      - /tmp
      - /run
      - /var/log/pihole

  # padd:
  #   build: padd
  #   network_mode: host
  #   labels:
  #     io.balena.features.dbus: "1"
  #   volumes:
  #     - "pihole_config:/etc/pihole:ro"
  #   cap_add:
  #     - SYS_TTY_CONFIG
  #   devices:
  #     - /dev/tty0
  #     - /dev/tty1
  #   tmpfs:
  #     - /tmp
  #     - /run

  # unbound:
  #   build: unbound
  #   cap_add:
  #    - NET_ADMIN
  #   ports:
  #     - "5053:5053/tcp"
  #     - "5053:5053/udp"

  # https://github.com/balena-labs-projects/fbcp
  # https://hub.balena.io/blocks/1792683/fbcp
  # fbcp:
  #   image: bh.cr/balenalabs/fbcp/1.0.4
  #   privileged: true

  # https://github.com/balenablocks/hostname
  # https://hub.balena.io/blocks/1918776/hostname-rpi
  hostname:
    build: ./hostname
    restart: no
    labels:
      io.balena.features.supervisor-api: 1
    environment:
      SET_HOSTNAME: ${SET_HOSTNAME:-device-name}

  # balena public device URL forwards HTTP traffic on port 80 only.
  # This proxy keeps Pi-hole reachable on the public URL and redirects `/` to `/admin/`.
  public-web:
    build: ./public-web
    restart: always
    network_mode: host
    depends_on:
      - pihole

  # https://hub.docker.com/r/tailscale/tailscale
  # https://github.com/tailscale/tailscale/blob/main/cmd/containerboot/main.go
  # https://tailscale.com/kb/1282/docker
  # https://tailscale.com/kb/1278/tailscaled
  # https://tailscale.com/kb/1241/tailscale-up
  # https://tailscale.com/kb/1242/tailscale-serve
  # https://tailscale.com/kb/1311/tailscale-funnel
  tailscale:
    build: ./tailscale
    restart: always
    network_mode: host
    privileged: true
    labels:
      io.balena.features.dbus: "1"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - "tailscale:/var/lib/tailscale"
    environment:
      TZ: Europe/Amsterdam
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY:-}
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-pi-hole}
      TS_ADVERTISE_ROUTES: ${TAILSCALE_ADVERTISE_ROUTES:-}
      TS_ACCEPT_ROUTES: ${TAILSCALE_ACCEPT_ROUTES:-false}
      TS_STATE_DIR: /var/lib/tailscale
